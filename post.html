<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Dragon - Post</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/post.js" defer></script>
</head>
<body data-page="post">

  <header class="site-header">
    <div class="container">
      <h1>Snap Dragon</h1>
      <p class="tagline">A safe space where you can express your mental health struggles, share experiences and find comfort in knowing you are not alone.</p>
    </div>
  </header>

  <nav class="site-nav">
    <div class="container nav-container">
      <ul class="nav-links left-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="createpost.html">Create Post</a></li>
      </ul>

      <ul class="nav-links right-nav" id="navAuth">
      </ul>
    </div>
  </nav>

  <main class="container">
    <article id="fullPost" class="card single-post"></article>

    <section class="card comments-section">
      <h2>Comments</h2>
      <div id="commentsContainer"></div>
    </section>

    <section class="card">
      <h2>Leave a Supportive Comment</h2>
      <form id="commentForm" novalidate>
        <div class="form-group">
          <label for="commentUsername">Username</label>
          <input type="text" id="commentUsername" placeholder="ex. user1234">
          <small class="error" id="commentUsernameError"></small>
        </div>

        <div class="form-group">
          <label for="commentText">Comment</label>
          <textarea id="commentText" rows="6"></textarea>
          <small class="error" id="commentTextError"></small>
        </div>

        <button type="submit">Post Comment</button>
        <p id="commentSuccess" class="success hidden">Your comment was added.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Snap Dragon.</p>
    </div>
  </footer>

</body>
</html>

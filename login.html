<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Dragon - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="login">

  <header class="site-header">
    <div class="container">
      <h1>Snap Dragon</h1>
      <p class="tagline">A safe space where you can express your mental health struggles, share experiences and find comfort in knowing you are not alone.</p>
    </div>
  </header>

  <nav class="site-nav">
    <div class="container nav-container">
      <ul class="nav-links left-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="createpost.html">Create Post</a></li>
      </ul>

      <ul class="nav-links right-nav" id="navAuth">
      </ul>
    </div>
  </nav>

  <main class="container">
    <section class="card form-card">
      <h2>Login</h2>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="text" id="loginEmail" placeholder="Enter your email">
          <small class="error" id="loginEmailError"></small>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password">
          <small class="error" id="loginPasswordError"></small>
        </div>

        <button type="submit">Login</button>
        <p class="error" id="loginGlobalError"></p>
      </form>

      <p class="form-note">Do not have an account yet? <a href="register.html">Register here</a>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Snap Dragon.</p>
    </div>
  </footer>

</body>
</html>
